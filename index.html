<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto Mulher-Gato</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';


        // 1. Cena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);


        // 2. Câmera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;


        // 3. Renderizador
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);


        // 4. Luzes
        const ambientLight = new THREE.AmbientLight(0xF2D8D8, 0.5);
        scene.add(ambientLight);


        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);


        // Material preto brilhante para o traje
        const suitMaterial = new THREE.MeshStandardMaterial({
            color: 0x000000,
            roughness: 0.2,
            metalness: 0.5
        });


        // Grupo da personagem
        const character = new THREE.Group();


        // Cabeça
        const headGeo = new THREE.SphereGeometry(0.2, 32, 32);
        const head = new THREE.Mesh(headGeo, suitMaterial);
        head.position.y = 0.8;
        character.add(head);


        // Orelhas
        const earGeo = new THREE.ConeGeometry(0.05, 0.1, 32);
        const leftEar = new THREE.Mesh(earGeo, suitMaterial);
        leftEar.position.set(-0.08, 0.22, 0);
        leftEar.rotation.z = -0.2;
        head.add(leftEar);


        const rightEar = new THREE.Mesh(earGeo, suitMaterial);
        rightEar.position.set(0.08, 0.22, 0);
        rightEar.rotation.z = 0.2;
        head.add(rightEar);


        // Torso
        const torsoGeo = new THREE.CylinderGeometry(0.15, 0.1, 0.5, 32);
        const torso = new THREE.Mesh(torsoGeo, suitMaterial);
        torso.position.y = 0.4;
        character.add(torso);


        // Braço Esquerdo
        const armGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.4, 32);
        const leftArm = new THREE.Mesh(armGeo, suitMaterial);
        leftArm.position.set(-0.25, 0.4, 0);
        leftArm.rotation.z = Math.PI / 12;
        character.add(leftArm);


        // Braço Direito
        const rightArm = new THREE.Mesh(armGeo, suitMaterial);
        rightArm.position.set(0.25, 0.4, 0);
        rightArm.rotation.z = -Math.PI / 12;
        character.add(rightArm);


        // Perna Esquerda
        const legGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.5, 32);
        const leftLeg = new THREE.Mesh(legGeo, suitMaterial);
        leftLeg.position.set(-0.1, -0.05, 0);
        character.add(leftLeg);


        // Perna Direita
        const rightLeg = new THREE.Mesh(legGeo, suitMaterial);
        rightLeg.position.set(0.1, -0.05, 0);
        character.add(rightLeg);


        scene.add(character);


        // 5. Game Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();


        // Ajuste de redimensionamento
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
